<div class="form-container">
  <div class="form-header">
    <h2>Publicar Necesidad </h2>
    <p>Panel de control del Municipio / Coordinador</p>
  </div>

  <form [formGroup]="necesidadForm" (ngSubmit)="onSubmit()" class="emergencia-form">

    <div class="form-group">
      <label for="convocatoria_id">Convocatoria Activa</label>
      <select id="convocatoria_id" formControlName="convocatoria_id" class="form-control">
        <option value="" disabled>Seleccione una convocatoria</option>
        <option *ngFor="let conv of convocatorias" [value]="conv.id">
          Convocatoria #{{ conv.id }} - {{ conv.estado }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="tipo_recurso_id">Tipo de Recurso Requerido</label>
      <select id="tipo_recurso_id" formControlName="tipo_recurso_id" class="form-control">
        <option value="" disabled>Seleccione el tipo de recurso</option>
        <option *ngFor="let tipo of tiposRecurso" [value]="tipo.id">
          {{ tipo.nombre }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="cantidad">Cantidad Necesaria</label>
      <input type="number" id="cantidad" formControlName="cantidad" class="form-control" placeholder="Ej: 500">
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción / Especificaciones</label>
      <textarea id="descripcion" formControlName="descripcion" class="form-control" rows="3" placeholder="Ej: Frazadas térmicas, agua mineral en botellas de 2L..."></textarea>
    </div>

    <button type="submit" [disabled]="necesidadForm.invalid" class="btn-submit">
      Publicar Necesidad
    </button>
  </form>
</div>

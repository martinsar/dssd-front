<div class="form-container">
  <div class="form-header">
    <h2>Alta de Emergencia</h2>
    <p>Panel de control del Municipio / Coordinador</p>
  </div>

  <!-- La etiqueta fundamental que agrupa todo el formulario -->
  <form [formGroup]="emergenciaForm" (ngSubmit)="onSubmit()" class="emergencia-form">
    
    <div class="form-group">
      <label for="tipoDesastre">Tipo de Desastre</label>
      <select id="tipoDesastre" formControlName="tipoDesastre" class="form-control">
        <option value="" disabled>Seleccione un tipo</option>
        <option *ngFor="let tipo of tiposEmergencia" [value]="tipo.tipoDesastre">
          {{ tipo.tipoDesastre }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="nivelGravedad">Nivel de Gravedad</label>
      <select id="nivelGravedad" formControlName="nivelGravedad" class="form-control">
        <option value="" disabled>Seleccione la gravedad</option>
        <option value="Bajo">Bajo</option>
        <option value="Medio">Medio</option>
        <option value="Alto">Alto</option>
        <option value="Crítico">Crítico</option>
      </select>
    </div>

    <div class="form-group">
      <label for="zonaAfectada">Zona Afectada</label>
      <input type="text" id="zonaAfectada" formControlName="zonaAfectada" class="form-control" placeholder="Ej: Barrio San Carlos">
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción detallada</label>
      <textarea id="descripcion" formControlName="descripcion" class="form-control" rows="4" placeholder="Describa la situación actual..."></textarea>
    </div>

    <button type="submit" [disabled]="emergenciaForm.invalid" class="btn-submit">
      Registrar e Iniciar Protocolo
    </button>
  </form>
</div>

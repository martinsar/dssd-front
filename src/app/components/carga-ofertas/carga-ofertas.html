<div class="form-container">
  <div class="form-header">
    <h2>Carga de Oferta</h2>
    <p>Panel de Representante de ONG</p>
  </div>

  <form [formGroup]="ofertaForm" (ngSubmit)="onSubmit()" class="emergencia-form">
    
    <div class="form-group">
      <label for="cantidad">Cantidad Ofrecida</label>
      <input type="number" id="cantidad" formControlName="cantidad" class="form-control" placeholder="Ej: 100">
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción del Recurso</label>
      <textarea id="descripcion" formControlName="descripcion" class="form-control" rows="3" placeholder="Ej: Frazadas polares tamaño plaza y media"></textarea>
    </div>

    <!-- Desplegable dinámico para Tipo de Recurso -->
    <div class="form-group">
      <label for="tipo_recurso_id">Tipo de Recurso</label>
      <select id="tipo_recurso_id" formControlName="tipo_recurso_id" class="form-control">
        <option value="" disabled>Seleccione un tipo de recurso</option>
        <option *ngFor="let tipo of tiposRecurso" [value]="tipo.id">
          {{ tipo.nombre }}
        </option>
      </select>
    </div>

    <!-- Desplegable dinámico para Organización -->
    <div class="form-group">
      <label for="organizacion_id">Tu Organización</label>
      <select id="organizacion_id" formControlName="organizacion_id" class="form-control">
        <option value="" disabled>Seleccione su organización</option>
        <option *ngFor="let org of organizaciones" [value]="org.id">
          {{ org.objetoSocial || 'ONG ID: ' + org.id }}
        </option>
      </select>
    </div>

    <!-- Desplegable dinámico para Convocatoria -->
    <div class="form-group">
      <label for="convocatoria_id">Convocatoria</label>
      <select id="convocatoria_id" formControlName="convocatoria_id" class="form-control">
        <option value="" disabled>Seleccione una convocatoria</option>
            <option *ngFor="let conv of convocatorias" [value]="conv.id">
          Convocatoria #{{ conv.id }}: {{ conv.emergencia?.tipoDesastre }} ({{ conv.emergencia?.zonaAfectada }}) - {{ conv.estado }}
            </option>  
         </select>
    </div>

    <button type="submit" [disabled]="ofertaForm.invalid" class="btn-submit">
      Registrar Oferta
    </button>
  </form>
</div>
